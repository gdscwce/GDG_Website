server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2;

    server_name gdgwce.dhanrajj.me;

    ssl_certificate /etc/nginx/ssl/live/gdgwce.dhanrajj.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/gdgwce.dhanrajj.me/privkey.pem;

    location / {
        proxy_pass http://client_main:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
