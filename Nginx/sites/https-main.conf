server {
    listen 443 ssl;
    server_name gdgwce.dhanrajj.me;

    ssl_certificate /etc/letsencrypt/live/gdgwce.dhanrajj.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdgwce.dhanrajj.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://client_main:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
